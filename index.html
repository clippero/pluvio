<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#020617">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3313/3313908.png">
    <title>PluvioTrack</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #020617;
            color: #f8fafc;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        #root {
            min-height: 100vh;
        }
        .glass-dark {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .glow-blue {
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.2);
        }
        ::-webkit-scrollbar { display: none; }
    </style>
    <script>
        // Polyfill para evitar errores de 'process is not defined'
        window.process = { env: { API_KEY: "" } };
    </script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "@google/genai": "https://esm.sh/@google/genai@^1.41.0",
    "recharts": "https://esm.sh/recharts@^3.7.0",

  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="selection:bg-blue-500/30">
    <div id="root">
        <div style="display:flex; flex-direction:column; justify-content:center; align-items:center; height:100vh; background:#020617; color:#3b82f6; font-family:sans-serif;">
            <div style="width:40px; height:40px; border:4px solid #1e293b; border-top:4px solid #3b82f6; border-radius:50%; animation:spin 1s linear infinite; margin-bottom:15px;"></div>
            <span style="font-weight:bold; letter-spacing:1px;">CARGANDO PLUVIOTRACK</span>
            <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
        </div>
    </div>
